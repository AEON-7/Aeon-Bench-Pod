# Builds + publishes the three AGENTIC HARNESS images:
#   ghcr.io/<owner>/aeon-harness-{hermes,openclaw,opencode}
#
# Why this exists: the pod drives the agentic suite by launching one of these containers per task,
# pointed at the served model's OpenAI-compatible endpoint. They were previously built by hand and
# existed only on the maintainer's own rig, so ANY other pod hit
#
#   AdapterError: docker create failed rc=1: Unable to find image 'aeon-harness-hermes:latest'
#   ... pull access denied ... repository does not exist
#
# and scored 0 on every agentic task — indistinguishable from a model that simply cannot do agentic
# work, and enough to make an otherwise-complete run un-rankable. Publishing them makes agentic
# actually reachable for external pods.
#
# multi-arch matters: DGX Spark / Grace-Blackwell rigs are arm64, x86 workstations are amd64.
name: harness-images

on:
  push:
    branches: [main]
    paths:
      - "deploy/pod/harness-*.Dockerfile"
      - ".github/workflows/harness-images.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one harness failing to build must not block the other two
      matrix:
        harness: [hermes, openclaw, opencode]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3        # arm64 layer of the multi-arch build
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aeon-harness-${{ matrix.harness }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: build + push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/pod/harness-${{ matrix.harness }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=harness-${{ matrix.harness }}
          cache-to: type=gha,mode=max,scope=harness-${{ matrix.harness }}
